name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >=20.11, so 20 is the floor we promise; 24 is
        # the current active LTS. Every version we claim to support runs here.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # build only joins src; this also typechecks the test files.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Smoke-test the transcripts the README quotes, so documentation drift
      # fails the build instead of misleading a reader.
      - name: README demo transcripts still reproduce
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out=$(node dist/cli.js demo/users-v1.json demo/users-v2.json)
          code=$?
          set -e
          echo "$out"
          test "$code" = "1"
          echo "$out" | grep -q "verdict: breaking (major)"
          echo "$out" | grep -q "\[openapi.operation.removed\]"
          test "$(node dist/cli.js --quiet demo/users-v1.json demo/users-v2.json)" = "breaking (major)"
          node dist/cli.js --contract env demo/env/app-v1.env demo/env/app-v2.env >/dev/null 2>&1 && exit 1 || true
          test "$(node dist/cli.js --rules | tail -n +3 | grep -c .)" = "56"

      # The tarball is what users install, so the tarball is what CI runs.
      - name: Smoke test the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls apidiff-*.tgz | head -n 1)
          if [ ! -f "$TARBALL" ]; then echo "npm pack produced nothing" >&2; exit 1; fi
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # Compare against package.json, not just "did it exit 0": a broken
          # entry guard makes the CLI exit 0 having printed nothing.
          expected=$(node -p "require('./node_modules/apidiff/package.json').version")
          actual=$(./node_modules/.bin/apidiff --version)
          echo "apidiff --version = $actual (expected $expected)"
          [ "$actual" = "$expected" ] || { echo "version mismatch" >&2; exit 1; }
